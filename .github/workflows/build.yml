name: Build Chill Zone RTP 0.1.2-alpha
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile and package RTP
        run: gradle clean build --console=plain --warning-mode=all
      - name: Show exactly which JAR was produced
        if: always()
        run: ls -lah build/libs/ || true
      - name: Upload compiled RTP JAR
        uses: actions/upload-artifact@v4
        with:
          name: chill-zone-rtp-0.1.2-alpha
          path: build/libs/chill-zone-rtp-0.1.2-alpha.jar
          if-no-files-found: error
